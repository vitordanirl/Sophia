services:
  postgres:
    image: postgres:16-alpine
    container_name: sophia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sophia
      POSTGRES_USER: sophia
      POSTGRES_PASSWORD: sophia
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sophia -d sophia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
